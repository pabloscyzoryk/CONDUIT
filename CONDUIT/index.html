<!doctype html>
<html lang="pl" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark light" />
    <meta name="description" content="CONDUIT — terminal do tradingu i copy tradingu sygnałów z Telegrama do MetaTrader 5." />
    <title>CONDUIT · Telegram → MT5 Terminal</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%236d7bff'/%3E%3Cpath d='M8 20l6-8 4 5 6-9' stroke='white' stroke-width='2.5' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />
    <script>
      // Ustaw motyw i paletę ZANIM React wystartuje — zero mignięcia
      // niewłaściwymi kolorami przy pierwszym malowaniu.
      (function () {
        var d = document.documentElement;
        var ok = ["violet", "red", "green", "yellow", "orange", "matrix", "vantage", "puprime"];
        try {
          var t = JSON.parse(localStorage.getItem("conduit.theme") || '"dark"');
          var p = JSON.parse(localStorage.getItem("conduit.palette") || '"violet"');
          d.dataset.theme = t === "light" ? "light" : "dark";
          d.dataset.palette = ok.indexOf(p) >= 0 ? p : "violet";
        } catch (e) {
          d.dataset.theme = "dark";
          d.dataset.palette = "violet";
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
